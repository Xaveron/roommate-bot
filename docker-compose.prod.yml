# Production stack: the bot + PostgreSQL (and, from stage 4, Caddy for the Mini App).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Needs BOT_TOKEN and POSTGRES_PASSWORD in .env (see .env.example and docs/DEPLOY.md).
# The bot uses long polling, so nothing here needs an open port. The database is only
# reachable from the internal compose network: never publish its port (Docker bypasses ufw).
name: roommate-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bot:
    build: .
    image: roommate-bot:latest
    env_file: .env
    environment:
      # Overrides any DATABASE_URL from .env: production always uses the bundled PostgreSQL.
      DATABASE_URL: postgresql+asyncpg://roommate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/roommate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roommate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: roommate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommate -d roommate"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  # Stage 4 (Telegram Mini App): HTTPS reverse proxy with automatic Let's Encrypt
  # certificates. Point a domain to this server, edit deploy/Caddyfile, then uncomment.
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   restart: unless-stopped
  #   logging: *logging

volumes:
  postgres-data:
  # caddy-data:
  # caddy-config:
